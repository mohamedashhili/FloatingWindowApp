name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          UPPER_ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "Found zip: $UPPER_ZIP"
          unzip -o "$UPPER_ZIP" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project root and build
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -exec dirname {} \; | head -n 1)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          mkdir -p app/src/main/res/drawable

          printf '%s\n' \
          '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
          '    android:width="108dp" android:height="108dp"' \
          '    android:viewportWidth="108" android:viewportHeight="108">' \
          '    <path android:fillColor="#4285F4"' \
          '        android:pathData="M54,54m-54,0a54,54 0,1 1,108 0a54,54 0,1 1,-108 0"/>' \
          '    <path android:fillColor="#FFFFFF"' \
          '        android:pathData="M30,40 L78,40 A6,6 0 0 1 84,46 L84,74 A6,6 0 0 1 78,80 L30,80 A6,6 0 0 1 24,74 L24,46 A6,6 0 0 1 30,40 Z"/>' \
          '</vector>' > app/src/main/res/drawable/ic_launcher.xml

          sed -i 's#@mipmap/ic_launcher#@drawable/ic_launcher#g' app/src/main/AndroidManifest.xml
          sed -i 's#android:foregroundServiceType="specialUse"#android:foregroundServiceType="systemAlertWindow"#g' app/src/main/AndroidManifest.xml

          echo "----- Manifest after patch -----"
          cat app/src/main/AndroidManifest.xml

          gradle assembleDebug
          mkdir -p /tmp/output
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/output/app-debug.apk
